# CI configuration. Edit this file, then commit and push.
#
# 1. Set stage (fetch -> decode_control -> execute -> integration -> system).
# 2. Point source_files at the SystemVerilog file for each module.
# 3. Add top_module, ports, or params mappings only when necessary.

yaml_version: 1
stage: fetch

modules:
  flopr:       {source_files: [Resettable_FF/rtl.sv]}
  flopenr:     {source_files: [Resettable_En_FF/rtl.sv]}
  adder:       {source_files: [Adder/rtl.sv]}
  mux2:        {source_files: ["2:1 Multiplexer/rtl.sv"]}
  imem:        {source_files: [IMEM/rtl.sv]}

  regfile:     {source_files: [Register_File/rtl.sv]}
  extend:      {source_files: [Sign_Extender/rtl.sv]}
  maindec:     {source_files: [Main_Decoder/rtl.sv]}
  aludec:      {source_files: [ALU_Decoder/rtl.sv]}
  controller:  {source_files: [Control_Unit/rtl.sv]}

  alu:         {source_files: [ALU/rtl.sv]}
  mux3:        {source_files: [3to1_Multiplexer/rtl.sv]}
  datapath:    {source_files: [Datapath/rtl.sv]}

  riscvsingle: {source_files: [RISCV_Wrapper/rtl.sv]}
  dmem:        {source_files: [DMEM/rtl.sv]}
  top:         {source_files: [Top/rtl.sv]}
